services:
  app:
    build: .
    ports:
      - "8080:${PORT:-8080}"
    environment:
      - DATABASE_URL=postgres://castogo:castogo@db:5432/castogo?sslmode=disable
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - tmp_audio:/tmp/audio

  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      - POSTGRES_USER=castogo
      - POSTGRES_PASSWORD=castogo
      - POSTGRES_DB=castogo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/migrations:/docker-entrypoint-initdb.d:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U castogo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  tmp_audio:
