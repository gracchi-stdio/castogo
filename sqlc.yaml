version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/queries/postgres"
    schema: "sql/migrations/postgres"
    gen:
      go:
        package: "sqlcpg"
        out: "internal/sqlcpg"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - column: "episodes.audio_metadata"
            go_type:
              import: "github.com/gracchi-stdio/castogo/internal/domain"
              type: "AudioMetadata"
          - column: "pages.metadata"
            go_type:
              import: "github.com/gracchi-stdio/castogo/internal/domain"
              type: "PageMetadata"
          - column: "page_blocks.content"
            go_type:
              import: "encoding/json"
              type: "RawMessage"

  # SQLite/libSQL dialect (Bunny remote + local files). database/sql instead of
  # pgx; JSON columns map to the same domain types as postgres — the types
  # implement sql.Scanner/driver.Valuer, which database/sql requires and pgx
  # gets for free from its JSON codec.
  - engine: "sqlite"
    queries: "sql/queries/sqlite"
    schema: "sql/migrations/sqlite"
    gen:
      go:
        package: "sqlcsqlite"
        out: "internal/sqlcsqlite"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - column: "episodes.audio_metadata"
            go_type:
              import: "github.com/gracchi-stdio/castogo/internal/domain"
              type: "AudioMetadata"
          - column: "pages.metadata"
            go_type:
              import: "github.com/gracchi-stdio/castogo/internal/domain"
              type: "PageMetadata"
          - column: "page_blocks.content"
            go_type:
              import: "github.com/gracchi-stdio/castogo/internal/domain"
              type: "RawMessage"
