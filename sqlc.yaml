version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/queries"
    schema: "sql/migrations"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - column: "episodes.audio_metadata"
            go_type:
              import: "github.com/gracchi-stdio/castogo/internal/domain"
              type: "AudioMetadata"
          - column: "pages.metadata"
            go_type:
              import: "github.com/gracchi-stdio/castogo/internal/domain"
              type: "PageMetadata"
          - column: "page_blocks.content"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
